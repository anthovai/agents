services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${MOODLE_DB_NAME:-moodle}
      POSTGRES_USER: ${MOODLE_DB_USER:-moodle}
      POSTGRES_PASSWORD: ${MOODLE_DB_PASS:-moodle}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MOODLE_DB_USER:-moodle}"]
      interval: 5s
      timeout: 5s
      retries: 20

  face-service:
    build:
      context: ./face-service
    environment:
      # Shared secret — Moodle sends it as X-Proctor-Key on every call.
      PROCTOR_API_KEY: ${PROCTOR_API_KEY:-change-me}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.363}
      FACE_REVIEW_MIN: ${FACE_REVIEW_MIN:-0.30}
      FACE_LIVENESS_THRESHOLD: ${FACE_LIVENESS_THRESHOLD:-0.60}
    volumes:
      # Model weights live on the host so the image stays small and the
      # licence-audited files are visible outside the container.
      - ./face-service/models:/app/models:ro
    # Not published to the host: only Moodle may reach it.
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:9000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Threshold calibration. Same image as face-service so the models and the
  # OpenCV build are the ones that will make the real decisions. Behind a
  # profile so `docker compose up` never starts it — run it with calibrate.sh.
  calibrate:
    build:
      context: ./face-service
    profiles: ["tools"]
    environment:
      PROCTOR_API_KEY: ${PROCTOR_API_KEY:-change-me}
    volumes:
      - ./face-service/models:/app/models:ro
      # Real faces, never committed: see .gitignore.
      - ./face-service/tests/faces:/app/tests/faces:ro
      # Public-domain portraits used only to check the pipeline discriminates.
      - ./face-service/tests/faces-public:/app/tests/faces-public:ro
      - ./reports:/app/reports
    command: python calibrate.py

  # One OpenAI-compatible endpoint in front of whatever model this deployment
  # is allowed to use — GPT-5 mini, or something on our own hardware for a
  # customer whose data may not leave the country. MIT licensed.
  #
  # Behind a profile: the AI features are an aid for reviewers, not part of any
  # decision, and the stack must run without them.
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    environment:
      # Ollama on the container host by default. A model on our own hardware
      # is the only configuration where no learner activity leaves the
      # building, which is what the customers who ask about this need.
      AI_LLM_BASE_URL: ${AI_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      AI_LLM_MODEL: ${AI_LLM_MODEL:-qwen2.5:7b-instruct}
      # Measured, not assumed: qwen3:8b answers navigation questions 15/15
      # where qwen2.5 manages 9/15, but fails the summary guardrail. See
      # reports/ai-ask-bench.txt and ai-service/app/config.py.
      AI_MODEL_ASK: ${AI_MODEL_ASK:-qwen3:8b}
      # Measured, see reports/ai-latency.txt. Long enough that a slow
      # answer arrives instead of failing; the answer to slowness is a
      # faster model, not a shorter limit.
      AI_TIMEOUT: ${AI_TIMEOUT:-300}
      AI_LLM_API_KEY: ${AI_LLM_API_KEY:-}
      AI_API_KEY: ${PROCTOR_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Not published to the host: only the platform talks to it.
    expose:
      - "9100"

  llm-gateway:
    image: ghcr.io/berriai/litellm:main-stable
    profiles: ["ai"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-kaiproctor-local}
    volumes:
      - ./docker/litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    # Not published to the host: only Moodle talks to it.
    expose:
      - "4000"

  moodle:
    build:
      context: .
      dockerfile: docker/moodle.Dockerfile
    depends_on:
      db:
        condition: service_healthy
      face-service:
        condition: service_started
    environment:
      # Only this container installs; see docker/moodle-entrypoint.sh.
      MOODLE_ROLE: web
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
      MOODLE_DB_HOST: db
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASS: ${MOODLE_DB_PASS:-moodle}
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASS: ${MOODLE_ADMIN_PASS:-Admin!2345}
      MOODLE_ADMIN_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@example.com}
    ports:
      # Bound to IPv4 explicitly, which is not the same as leaving it to
      # Docker.
      #
      # "8080:80" binds both stacks, and on Docker Desktop for Windows the IPv6
      # side accepts the connection and then resets it. `localhost` resolves to
      # ::1 first, so the browser gets ERR_CONNECTION_RESET — and does not fall
      # back to IPv4, because a reset is an answer rather than a failure to
      # connect. The site was up and serving the whole time; nothing could
      # reach it by name.
      #
      # Bound this way, nothing listens on ::1, the browser gets a refusal
      # there, and falls back to 127.0.0.1 where the site is. Binding to
      # loopback only is also the right default for a stack meant to be
      # demonstrated on one machine.
      - "127.0.0.1:8080:80"
    volumes:
      - moodledata:/var/moodledata
      # Plugins are bind-mounted: edit on the host, reload in the browser.
      # Moodle 5.0+ serves from public/, so plugins live under it too.
      - ./moodle/plugins/local_kaiproctor:/var/www/html/public/local/kaiproctor
      - ./moodle/plugins/quizaccess_kaiproctor:/var/www/html/public/mod/quiz/accessrule/kaiproctor
      - ./moodle/plugins/mod_kaivideo:/var/www/html/public/mod/kaivideo

  cron:
    build:
      context: .
      dockerfile: docker/moodle.Dockerfile
    depends_on:
      moodle:
        condition: service_started
    environment:
      # Shares the image with the web container but must never install: two
      # installers on one moodledata volume race each other and corrupt it.
      MOODLE_ROLE: cron
      MOODLE_WWWROOT: ${MOODLE_WWWROOT:-http://localhost:8080}
      MOODLE_DB_HOST: db
      MOODLE_DB_NAME: ${MOODLE_DB_NAME:-moodle}
      MOODLE_DB_USER: ${MOODLE_DB_USER:-moodle}
      MOODLE_DB_PASS: ${MOODLE_DB_PASS:-moodle}
    volumes:
      - moodledata:/var/moodledata
      # The same plugin set as the web container. A plugin installed in the
      # database but missing from this container's disk makes every cron run
      # log it as broken.
      - ./moodle/plugins/local_kaiproctor:/var/www/html/public/local/kaiproctor
      - ./moodle/plugins/quizaccess_kaiproctor:/var/www/html/public/mod/quiz/accessrule/kaiproctor
      - ./moodle/plugins/mod_kaivideo:/var/www/html/public/mod/kaivideo
    # Moodle scheduled tasks (evidence purge, notifications) need a real cron.
    command: sh -c "while true; do php /var/www/html/admin/cli/cron.php >/dev/null 2>&1; sleep 60; done"

volumes:
  db-data:
  moodledata:
